# PostgreSQL de développement uniquement. Ne pas utiliser tel quel en production.
services:
  postgres:
    image: postgres:18-alpine
    container_name: tesla-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tesla}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tesla_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-tesla}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - tesla-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tesla-postgres-data:
