name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'
  # Base PostgreSQL éphémère du job (service ci-dessous), jamais une base réelle.
  TEST_DATABASE_URL: postgresql://tesla:tesla_ci@localhost:5432/tesla_test?schema=public

jobs:
  quality:
    name: Format, lint, types, tests unitaires, build, dépendances
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Valeurs factices : aucun service n'est requis (les tests unitaires simulent la base).
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Installation reproductible (génère aussi le client Prisma)
        run: npm ci
      - name: Validation du schéma Prisma
        run: npx -w @tesla/api prisma validate
      - name: Formatage
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests unitaires
        run: npm run test
      - name: Build de production
        run: npm run build
      - name: Build web en mode Vercel (appels même origine /api/v1)
        run: npm run build -w @tesla/web
        env:
          NEXT_PUBLIC_API_URL: /api/v1
      - name: Audit des dépendances de production (gravité ≥ high)
        run: npm run audit:prod

  integration:
    name: Intégration PostgreSQL et migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: tesla
          POSTGRES_PASSWORD: tesla_ci
          POSTGRES_DB: tesla_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tesla -d tesla_test" --health-interval 5s
          --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:shared
      - name: Migrations appliquées sur base vide (migrate deploy)
        working-directory: apps/api
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Aucune dérive entre migrations et schéma
        working-directory: apps/api
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Tests d'intégration (contraintes, triggers, permissions, concurrence)
        run: npm run test:int -w @tesla/api

  browser:
    name: Recettes navigateur (comptes, offline-first)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [quality]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: tesla
          POSTGRES_PASSWORD: tesla_ci
          POSTGRES_DB: tesla_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tesla -d tesla_test" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://tesla:tesla_ci@localhost:5432/tesla_test?schema=public
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      CORS_ORIGINS: http://localhost:3000
      PLAYWRIGHT_VERSION: 1.56.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Migrations
        working-directory: apps/api
        run: npx prisma migrate deploy
      - name: Playwright (hors dépendances du dépôt) et Chromium
        run: |
          npm install --no-save --workspaces=false "playwright@${PLAYWRIGHT_VERSION}"
          npx playwright install --with-deps chromium
      - name: Fixture fictive (base « _test » remise à zéro)
        working-directory: apps/api
        run: OFFLINE_FIXTURE="$RUNNER_TEMP/fixture.json" npx tsx test/offline-browser-fixture.mts
      - name: Démarrage de l'API et du web de production
        run: |
          # Clé éphémère du job (exigée en production) : jamais une clé réelle.
          export MEDICAL_DATA_KEY="$(openssl rand -base64 32)"
          NODE_ENV=production SWAGGER_ENABLED=false node apps/api/dist/main.js > "$RUNNER_TEMP/api.log" 2>&1 &
          npm run start -w @tesla/web > "$RUNNER_TEMP/web.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -fs http://localhost:4000/api/v1/health > /dev/null && curl -fs http://localhost:3000/connexion > /dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/api.log" "$RUNNER_TEMP/web.log"
          exit 1
      - name: Recette offline-first (390 px)
        run: |
          OFFLINE_FIXTURE="$RUNNER_TEMP/fixture.json" PROFILE_DIR="$RUNNER_TEMP/profile" \
          SW_FILE="$PWD/apps/web/public/sw.js" node apps/web/test/offline-first.browser.mjs
      - name: Recette des comptes (installation, activation, gestion)
        run: |
          node apps/api/dist/jobs/create-admin.js --email admin-recette@recette.test \
            --web-url http://localhost:3000 > "$RUNNER_TEMP/link.txt"
          LINK_FILE="$RUNNER_TEMP/link.txt" node apps/web/test/accounts.browser.mjs
      - name: Balayage de l'interface (4 profils, 7 largeurs)
        run: |
          node apps/api/dist/jobs/create-admin.js --recover --email admin-recette@recette.test \
            --web-url http://localhost:3000 > "$RUNNER_TEMP/sweep-link.txt"
          ADMIN_EMAIL=admin-recette@recette.test LINK_FILE="$RUNNER_TEMP/sweep-link.txt" \
          OFFLINE_FIXTURE="$RUNNER_TEMP/fixture.json" node apps/web/test/ui-sweep.browser.mjs
      - name: Recette du circuit papier collectif (distribution, saisie, correction par le plein)
        run: |
          (cd apps/api && npx tsx test/paper-browser-fixture.mts)
          node apps/web/test/paper-distribution.browser.mjs
      - name: Journaux des serveurs (en cas d'échec)
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP/api.log" "$RUNNER_TEMP/web.log"

  ops:
    name: Scripts d'exploitation (shellcheck, sauvegardes, Nginx)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: tesla
          POSTGRES_PASSWORD: tesla_ci
          POSTGRES_DB: tesla_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tesla -d tesla_test" --health-interval 5s
          --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Shellcheck des scripts de déploiement
        run: shellcheck -x -S warning deploy/scripts/*.sh deploy/scripts/tests/*.sh
      - name: Releases, retour arrière et garde-fous (arborescence /var/www/tesla simulée)
        run: bash deploy/scripts/tests/deploy-scripts.test.sh
      - name: Unités systemd (syntaxe)
        run: |
          t="$RUNNER_TEMP/systemd"; mkdir -p "$t"; cp deploy/systemd/* "$t/"; cd "$t"
          for f in *@.service *@.timer; do ln -s "$f" "${f/@./@production.}"; done
          out="$(systemd-analyze verify --man=no tesla-*@production.* 2>&1 || true)"
          echo "$out"
          # Seuls les binaires et unités absents du runner (node, scripts, postgresql) sont tolérés.
          ! grep -vE 'is not executable|Unit postgresql.service not found|Failed to create .*/start' <<< "$out" | grep -q .
      - run: npm ci
      - name: Migrations (base sauvegardée par le test)
        working-directory: apps/api
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Sauvegarde, restauration et garde-fous (outils PostgreSQL 18 du conteneur)
        run: |
          docker run --rm --network host -e TEST_DATABASE_URL="$TEST_DATABASE_URL" \
            -v "$PWD:/repo:ro" postgres:18-alpine sh -c \
            'apk add --no-cache bash gnupg coreutils findutils curl > /dev/null && bash /repo/deploy/scripts/tests/backup-scripts.test.sh'
      - name: Configuration Nginx (nginx 1.24 ; API seule ×2, mode historique, ACME)
        run: |
          t="$RUNNER_TEMP/nginx"; mkdir -p "$t/conf.d" "$t/tesla"
          cert() {
            mkdir -p "$t/le/live/$1"
            openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=$1" \
              -keyout "$t/le/live/$1/privkey.pem" -out "$t/le/live/$1/fullchain.pem" 2> /dev/null
          }
          for pair in production:api.example.test:4000 preproduction:api-pre.example.test:4100; do
            IFS=: read -r instance domain api <<< "$pair"
            cert "$domain"
            # Secret du relais au format écrit par bootstrap.sh (32 caractères : map_hash_bucket_size).
            printf 'map $http_x_tesla_proxy_secret $tesla_proxied_%s {\n    default 0;\n    "%s" 1;\n}\n' \
              "$instance" "$(openssl rand -hex 16)" > "$t/tesla/$instance-proxy.conf"
            sed -e "s/DOMAINE/$domain/g" -e "s/INSTANCE/$instance/g" -e "s#TESLA_ROOT#/var/www/tesla#g" \
              -e "s/API_PORT/$api/" deploy/nginx/tesla-api.conf > "$t/conf.d/$instance.conf"
          done
          cert legacy.example.test
          sed -e "s/DOMAINE/legacy.example.test/g" -e "s/INSTANCE/legacy/g" -e "s#TESLA_ROOT#/var/www/tesla#g" \
            -e "s/API_PORT/4200/" -e "s/WEB_PORT/3200/" deploy/nginx/tesla.conf > "$t/conf.d/legacy.conf"
          sed -e 's/DOMAINE/acme.example.test/g' -e "s#TESLA_ROOT#/var/www/tesla#g" \
            deploy/nginx/tesla-acme.conf > "$t/conf.d/acme.conf"
          docker run --rm -v "$t/conf.d:/etc/nginx/conf.d:ro" -v "$t/le:/etc/letsencrypt:ro" \
            -v "$t/tesla:/etc/nginx/tesla:ro" nginx:1.24 nginx -t
