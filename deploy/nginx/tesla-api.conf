# Nginx de l'API TESLA seule (WEB_HOSTING=vercel), compatible nginx 1.24 (Ubuntu 24.04).
# Le web est servi par Vercel, qui relaie /api/v1/* vers ce domaine (apps/web/src/proxy.ts).
# Installé par deploy/scripts/bootstrap.sh, qui remplace DOMAINE, INSTANCE, API_PORT et TESLA_ROOT
# (racine de déploiement). Aucune directive globale : ce fichier ne touche à aucun autre site.
# Le certificat doit exister AVANT ce fichier : bootstrap.sh installe d'abord tesla-acme.conf
# (HTTP seul), obtient le certificat par « certbot certonly --webroot », puis installe celui-ci.
#
# Adresse IP du client (limitations de l'API et de Nginx) : derrière Vercel, $remote_addr est une
# adresse de Vercel, partagée par tous les utilisateurs. Le proxy Vercel transmet l'adresse réelle
# dans X-Tesla-Client-Ip, accompagnée du secret partagé X-Tesla-Proxy-Secret. Cette adresse n'est
# retenue QUE si le secret est exact (fichier /etc/nginx/tesla/INSTANCE-proxy.conf, 0600, généré
# par bootstrap.sh, définissant $tesla_proxied_INSTANCE) ; sinon $remote_addr fait foi. Les deux
# en-têtes ne sont jamais transmis à l'API.
include /etc/nginx/tesla/INSTANCE-proxy.conf;
map "$tesla_proxied_INSTANCE:$http_x_tesla_client_ip" $tesla_client_ip_INSTANCE {
    "~^1:(?<tesla_ip_INSTANCE>[0-9A-Fa-f:.]{2,45})$" $tesla_ip_INSTANCE;
    default $remote_addr;
}
# Horodatage des erreurs au format de l'API (UTC, suffixe Z, comme z.iso.datetime()).
map $time_iso8601 $tesla_time_INSTANCE {
    "~^(?<tesla_t_INSTANCE>.+)\+00:00$" "${tesla_t_INSTANCE}Z";
    default $time_iso8601;
}

# Limitation d’appoint des routes d’authentification (la limitation métier est dans l’API).
# Seuil large : une réunion de 25 routiers derrière le même Wi-Fi partage une adresse IP.
limit_req_zone $tesla_client_ip_INSTANCE zone=tesla_auth_INSTANCE:10m rate=30r/m;
limit_req_zone $tesla_client_ip_INSTANCE zone=tesla_api_INSTANCE:10m rate=20r/s;

upstream tesla_api_INSTANCE { server 127.0.0.1:API_PORT; keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name DOMAINE;
    # Validation Let's Encrypt (webroot), puis HTTPS obligatoire.
    location /.well-known/acme-challenge/ { root TESLA_ROOT/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # « http2 on; » n'existe qu'à partir de nginx 1.25.1 : forme compatible 1.24.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name DOMAINE;

    ssl_certificate     /etc/letsencrypt/live/DOMAINE/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAINE/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:tesla_ssl_INSTANCE:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS : ce fichier n'est installé qu'une fois le certificat obtenu et vérifié.
    add_header Strict-Transport-Security "max-age=31536000" always;
    server_tokens off;

    # Corps JSON uniquement : les fichiers sont envoyés directement à R2 par URL signée (D143).
    client_max_body_size 10m;
    gzip on;
    gzip_vary on;
    gzip_types application/json;

    access_log /var/log/nginx/tesla-INSTANCE.access.log;
    error_log  /var/log/nginx/tesla-INSTANCE.error.log warn;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $tesla_client_ip_INSTANCE;
    # L'API fait confiance au premier proxy (TRUST_PROXY=true) : l'adresse est écrasée, pas ajoutée.
    proxy_set_header X-Forwarded-For $tesla_client_ip_INSTANCE;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Valeur vide : en-têtes du proxy Vercel jamais transmis à l'API.
    proxy_set_header X-Tesla-Proxy-Secret "";
    proxy_set_header X-Tesla-Client-Ip "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    # Documents PDF et ZIP générés à la demande (lots de copies papier) : 120 s au plus.
    proxy_read_timeout 120s;

    # API arrêtée ou en redémarrage : erreur JSON au format de l'API (aucun détail technique).
    error_page 502 503 504 =503 @tesla_unavailable;
    location @tesla_unavailable {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"statusCode":503,"code":"SERVICE_UNAVAILABLE","message":"Service momentanément indisponible. Réessayez dans quelques minutes.","path":"/api/v1","timestamp":"$tesla_time_INSTANCE"}';
    }

    location = /api/v1/auth/login {
        limit_req zone=tesla_auth_INSTANCE burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://tesla_api_INSTANCE;
    }
    # Inscription sur invitation et mot de passe oublié (D162, D166) : mêmes limites que la connexion,
    # en plus de la limitation persistante de l'API (par e-mail, invitation et adresse IP).
    location ^~ /api/v1/auth/activation/ {
        limit_req zone=tesla_auth_INSTANCE burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://tesla_api_INSTANCE;
    }
    location ^~ /api/v1/auth/password-reset/ {
        limit_req zone=tesla_auth_INSTANCE burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://tesla_api_INSTANCE;
    }
    location ^~ /api/v1/auth/account-link/ {
        limit_req zone=tesla_auth_INSTANCE burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://tesla_api_INSTANCE;
    }
    location = /api/v1/auth/password {
        limit_req zone=tesla_auth_INSTANCE burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://tesla_api_INSTANCE;
    }
    location /api/ {
        limit_req zone=tesla_api_INSTANCE burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://tesla_api_INSTANCE;
    }
    # Documentation de l'API : jamais exposée en production (SWAGGER_ENABLED=false).
    location /api/docs { return 404; }

    # Aucune page web sur ce domaine : l'application est sur Vercel.
    location / { return 404; }
}
