# Nginx de l'ORIGINE web TESLA (WEB_HOSTING=ovh), compatible nginx 1.24 (Ubuntu 24.04).
# Le navigateur reste sur le domaine Vercel (PUBLIC_HOST) ; Vercel, simple proxy
# (deploy/vercel-proxy/vercel.json), relaie TOUTES les requêtes vers ce domaine technique
# (DOMAINE) en ajoutant le secret partagé X-Tesla-Proxy-Secret. Ce vhost sert Next.js (tesla-web@)
# et l'API (tesla-api@) en même origine. Voir docs/migration-ovh/03-architecture.md.
# Installé par deploy/scripts/bootstrap.sh (mode ovh), qui remplace DOMAINE (WEB_ORIGIN_DOMAIN),
# PUBLIC_HOST (hôte de CORS_ORIGINS), INSTANCE, API_PORT, WEB_PORT et TESLA_ROOT.
#
# Dépendances (dans le contexte http, déjà chargées par le vhost API tesla-INSTANCE, conservé) :
#   - $tesla_proxied_INSTANCE (map du secret, /etc/nginx/tesla/INSTANCE-proxy.conf) ;
#   - upstream tesla_api_INSTANCE, $tesla_time_INSTANCE.
# Ce fichier ne les redéfinit pas (une double définition empêcherait Nginx de démarrer).
#
# Adresse IP du client : Vercel écrase X-Real-IP / X-Forwarded-For avec l'adresse du visiteur
# (aucune adresse fournie par le client n'est transmise). Elle n'est retenue QUE si le secret est
# exact ; une requête sans secret est de toute façon refusée (403).
map "$tesla_proxied_INSTANCE:$http_x_real_ip" $tesla_origin_ip_INSTANCE {
    "~^1:(?<tesla_oip_INSTANCE>[0-9A-Fa-f:.]{2,45})$" $tesla_oip_INSTANCE;
    default $remote_addr;
}

# Mêmes seuils que le vhost API, zones distinctes (deux vhosts ne partagent pas une zone).
limit_req_zone $tesla_origin_ip_INSTANCE zone=tesla_origin_auth_INSTANCE:10m rate=30r/m;
limit_req_zone $tesla_origin_ip_INSTANCE zone=tesla_origin_api_INSTANCE:10m rate=20r/s;

upstream tesla_web_INSTANCE { server 127.0.0.1:WEB_PORT; keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name DOMAINE;
    server_tokens off;
    # Validation Let's Encrypt (webroot), puis HTTPS obligatoire.
    location /.well-known/acme-challenge/ { root TESLA_ROOT/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # « http2 on; » n'existe qu'à partir de nginx 1.25.1 : forme compatible 1.24.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    # PUBLIC_HOST : filet de sécurité si Vercel transmettait l'hôte public au lieu de celui de la
    # destination ; la requête arrive alors ici et jamais sur le site par défaut d'une autre
    # application du VPS. Ce nom ne résout pas vers ce serveur : aucun accès direct possible.
    server_name DOMAINE PUBLIC_HOST;

    ssl_certificate     /etc/letsencrypt/live/DOMAINE/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAINE/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:tesla_origin_ssl_INSTANCE:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    server_tokens off;

    # Origine réservée au proxy Vercel : sans secret exact, rien n'est servi (ni page ni API).
    # Les utilisateurs ne peuvent donc jamais travailler sur ce domaine technique (cookies,
    # service worker et stockage local restent ceux du domaine Vercel).
    if ($tesla_proxied_INSTANCE != 1) { return 403; }

    # Cache du CDN Vercel désactivé pour toutes les réponses relayées (doublé dans vercel.json) :
    # une page conservée par Vercel après un déploiement sur OVH référencerait des fichiers
    # supprimés. En-tête consommé par Vercel, jamais transmis au navigateur.
    add_header Vercel-CDN-Cache-Control "no-store" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Corps JSON uniquement : les fichiers sont envoyés directement à R2 par URL signée (D143).
    client_max_body_size 10m;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/x-component;

    access_log /var/log/nginx/tesla-INSTANCE-origin.access.log;
    error_log  /var/log/nginx/tesla-INSTANCE-origin.error.log warn;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # Hôte public pour Next.js et l'API : toute URL absolue ou redirection construite à partir de
    # la requête désigne le domaine Vercel, jamais ce domaine technique.
    proxy_set_header Host PUBLIC_HOST;
    proxy_set_header X-Forwarded-Host PUBLIC_HOST;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $tesla_origin_ip_INSTANCE;
    # L'API fait confiance au premier proxy (TRUST_PROXY=true) : l'adresse est écrasée, pas ajoutée.
    proxy_set_header X-Forwarded-For $tesla_origin_ip_INSTANCE;
    # Valeur vide : en-têtes du proxy jamais transmis aux applications.
    proxy_set_header X-Tesla-Proxy-Secret "";
    proxy_set_header X-Tesla-Client-Ip "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    # Documents PDF et ZIP générés à la demande (lots de copies papier) : 120 s au plus.
    proxy_read_timeout 120s;

    # API arrêtée ou en redémarrage : erreur JSON au format de l'API (aucun détail technique).
    location @tesla_api_unavailable {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Vercel-CDN-Cache-Control "no-store" always;
        return 503 '{"statusCode":503,"code":"SERVICE_UNAVAILABLE","message":"Service momentanément indisponible. Réessayez dans quelques minutes.","path":"/api/v1","timestamp":"$tesla_time_INSTANCE"}';
    }
    # Web arrêté ou en redémarrage : page de maintenance statique (réponse HTTP reçue : le service
    # worker ne sert ses pages conservées qu'en cas d'échec réseau, pas pour cette page).
    location = /maintenance.html {
        root TESLA_ROOT/maintenance;
        internal;
        add_header Cache-Control "no-store" always;
        add_header Vercel-CDN-Cache-Control "no-store" always;
    }

    location = /api/v1/auth/login {
        limit_req zone=tesla_origin_auth_INSTANCE burst=20 nodelay;
        limit_req_status 429;
        error_page 502 503 504 =503 @tesla_api_unavailable;
        proxy_pass http://tesla_api_INSTANCE;
    }
    # Inscription sur invitation et mot de passe oublié (D162, D166) : mêmes limites que la connexion,
    # en plus de la limitation persistante de l'API (par e-mail, invitation et adresse IP).
    location ^~ /api/v1/auth/activation/ {
        limit_req zone=tesla_origin_auth_INSTANCE burst=20 nodelay;
        limit_req_status 429;
        error_page 502 503 504 =503 @tesla_api_unavailable;
        proxy_pass http://tesla_api_INSTANCE;
    }
    location ^~ /api/v1/auth/password-reset/ {
        limit_req zone=tesla_origin_auth_INSTANCE burst=20 nodelay;
        limit_req_status 429;
        error_page 502 503 504 =503 @tesla_api_unavailable;
        proxy_pass http://tesla_api_INSTANCE;
    }
    location ^~ /api/v1/auth/account-link/ {
        limit_req zone=tesla_origin_auth_INSTANCE burst=20 nodelay;
        limit_req_status 429;
        error_page 502 503 504 =503 @tesla_api_unavailable;
        proxy_pass http://tesla_api_INSTANCE;
    }
    location = /api/v1/auth/password {
        limit_req zone=tesla_origin_auth_INSTANCE burst=20 nodelay;
        limit_req_status 429;
        error_page 502 503 504 =503 @tesla_api_unavailable;
        proxy_pass http://tesla_api_INSTANCE;
    }
    location /api/ {
        limit_req zone=tesla_origin_api_INSTANCE burst=40 nodelay;
        limit_req_status 429;
        error_page 502 503 504 =503 @tesla_api_unavailable;
        proxy_pass http://tesla_api_INSTANCE;
    }
    # Documentation de l'API : jamais exposée en production (SWAGGER_ENABLED=false).
    location /api/docs { return 404; }

    # Next.js : pages, charges RSC, /_next/static, manifeste, sw.js, icônes. Les en-têtes de cache
    # et de sécurité sont ceux de next.config.ts (sw.js : no-store).
    location / {
        error_page 502 503 504 /maintenance.html;
        proxy_pass http://tesla_web_INSTANCE;
    }

    # Fichiers cachés (.env, .git…) : jamais servis.
    location ~ /\. { deny all; }
}
