# Nginx de référence pour TESLA (une instance par domaine). Copier dans
# /etc/nginx/sites-available/, remplacer DOMAINE et les ports de l'instance, puis :
#   nginx -t && systemctl reload nginx
# Préproduction : même fichier avec son domaine, WEB_PORT=3100, API_PORT=4100 (voir deploy/env/).
# Certificats : certbot --nginx -d DOMAINE (renouvellement par certbot.timer).

# Limitation d’appoint des routes d’authentification (la limitation métier est dans l’API).
# Seuil large : une réunion de 25 routiers derrière le même Wi-Fi partage une adresse IP.
limit_req_zone $binary_remote_addr zone=tesla_auth:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=tesla_api:10m rate=20r/s;

upstream tesla_api { server 127.0.0.1:4000; keepalive 16; }
upstream tesla_web { server 127.0.0.1:3000; keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name DOMAINE;
    # Validation Let's Encrypt (webroot ou plugin nginx), puis HTTPS obligatoire.
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name DOMAINE;

    ssl_certificate     /etc/letsencrypt/live/DOMAINE/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAINE/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:tesla_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS : à activer après vérification du certificat (une erreur bloquerait les navigateurs).
    add_header Strict-Transport-Security "max-age=31536000" always;
    server_tokens off;

    client_max_body_size 10m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    access_log /var/log/nginx/tesla.access.log;
    error_log  /var/log/nginx/tesla.error.log warn;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # L'API fait confiance au premier proxy (TRUST_PROXY=true) : l'adresse est écrasée, pas ajoutée.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;

    location = /api/v1/auth/login {
        limit_req zone=tesla_auth burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://tesla_api;
    }
    location ^~ /api/v1/auth/account-link/ {
        limit_req zone=tesla_auth burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://tesla_api;
    }
    location /api/ {
        limit_req zone=tesla_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://tesla_api;
    }
    # Documentation de l'API : jamais exposée en production (SWAGGER_ENABLED=false).
    location /api/docs { return 404; }

    location / {
        proxy_pass http://tesla_web;
    }

    # Fichiers cachés (.env, .git…) : jamais servis.
    location ~ /\. { deny all; }
}
