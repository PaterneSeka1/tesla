# Nginx de référence pour TESLA (une instance par domaine), compatible nginx 1.24 (Ubuntu 24.04).
# Installé par deploy/scripts/bootstrap.sh, qui remplace DOMAINE, INSTANCE et les ports :
#   production : 3000 / 4000 ; préproduction : 3100 / 4100 (voir deploy/env/).
# Le certificat doit exister AVANT ce fichier : bootstrap.sh installe d'abord tesla-acme.conf
# (HTTP seul), obtient le certificat par « certbot certonly --webroot », puis installe celui-ci.
# Renouvellement : certbot.timer (webroot conservé ci-dessous), rechargement par le deploy-hook.

# Limitation d’appoint des routes d’authentification (la limitation métier est dans l’API).
# Seuil large : une réunion de 25 routiers derrière le même Wi-Fi partage une adresse IP.
limit_req_zone $binary_remote_addr zone=tesla_auth_INSTANCE:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=tesla_api_INSTANCE:10m rate=20r/s;

upstream tesla_api_INSTANCE { server 127.0.0.1:API_PORT; keepalive 16; }
upstream tesla_web_INSTANCE { server 127.0.0.1:WEB_PORT; keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name DOMAINE;
    # Validation Let's Encrypt (webroot ou plugin nginx), puis HTTPS obligatoire.
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # « http2 on; » n'existe qu'à partir de nginx 1.25.1 : forme compatible 1.24.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name DOMAINE;

    ssl_certificate     /etc/letsencrypt/live/DOMAINE/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAINE/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:tesla_ssl_INSTANCE:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS : ce fichier n'est installé qu'une fois le certificat obtenu et vérifié.
    add_header Strict-Transport-Security "max-age=31536000" always;
    server_tokens off;

    client_max_body_size 10m;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    access_log /var/log/nginx/tesla-INSTANCE.access.log;
    error_log  /var/log/nginx/tesla-INSTANCE.error.log warn;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # L'API fait confiance au premier proxy (TRUST_PROXY=true) : l'adresse est écrasée, pas ajoutée.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Application arrêtée ou en redémarrage : page de maintenance statique (aucun détail technique).
    error_page 502 503 504 /maintenance.html;
    location = /maintenance.html {
        root /var/www/tesla;
        internal;
        add_header Cache-Control "no-store" always;
    }

    location = /api/v1/auth/login {
        limit_req zone=tesla_auth_INSTANCE burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://tesla_api_INSTANCE;
    }
    location ^~ /api/v1/auth/account-link/ {
        limit_req zone=tesla_auth_INSTANCE burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://tesla_api_INSTANCE;
    }
    location = /api/v1/auth/password {
        limit_req zone=tesla_auth_INSTANCE burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://tesla_api_INSTANCE;
    }
    location /api/ {
        limit_req zone=tesla_api_INSTANCE burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://tesla_api_INSTANCE;
    }
    # Documentation de l'API : jamais exposée en production (SWAGGER_ENABLED=false).
    location /api/docs { return 404; }

    location / {
        proxy_pass http://tesla_web_INSTANCE;
    }

    # Fichiers cachés (.env, .git…) : jamais servis.
    location ~ /\. { deny all; }
}
