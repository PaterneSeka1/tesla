# Vhost provisoire HTTP seul, le temps d'obtenir le premier certificat (bootstrap.sh) :
#   certbot certonly --webroot -w /var/www/letsencrypt -d DOMAINE
# Remplacé ensuite par tesla.conf, qui conserve le même chemin ACME pour les renouvellements.
server {
    listen 80;
    listen [::]:80;
    server_name DOMAINE;
    server_tokens off;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 503; }
}
