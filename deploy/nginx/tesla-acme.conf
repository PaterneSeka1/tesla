# Vhost provisoire HTTP seul, le temps d'obtenir le premier certificat (bootstrap.sh) :
#   certbot certonly --webroot -w TESLA_ROOT/acme -d DOMAINE
# Remplacé ensuite par tesla-api.conf (ou tesla.conf en mode historique), qui conserve le même chemin ACME pour les renouvellements.
server {
    listen 80;
    listen [::]:80;
    server_name DOMAINE;
    server_tokens off;
    location /.well-known/acme-challenge/ { root TESLA_ROOT/acme; }
    location / { return 503; }
}
